<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>À propos — Printemps des Marais</title>
  <meta name="description" content="Qui porte le projet : équipe, association, partenaires, valeurs et engagement.">
  <link rel="stylesheet" href="font.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main" class="sr-only">Aller au contenu</a>

  <header id="site-header" aria-label="En-tête du site"></header>

  <main id="main" class="wrap" style="min-height:60vh;padding:2rem 1rem;">
    <h1>À propos</h1>
    <p>(Contenu à venir)</p>
  </main>

  <footer id="site-footer" aria-label="Pied de page"></footer>

  <script>
    (function(){
      function injectFragment(targetId, url){
        const slot = document.getElementById(targetId);
        if(!slot) return;
        fetch(url,{credentials:'same-origin'}).then(r=>r.text()).then(html=>{
          slot.innerHTML = html;
          const scripts = slot.querySelectorAll('script');
          scripts.forEach(old=>{ const s=document.createElement('script'); for(const {name,value} of old.attributes) s.setAttribute(name,value); s.text=old.textContent; old.replaceWith(s); });
        }).catch(()=>{
          if(targetId==='site-header'){ slot.innerHTML='<div class="nav"><a class="brand" href="index.html" style="color:#fff;text-decoration:none;font-weight:800">Printemps des Marais</a></div>'; }
          else { slot.innerHTML='<div style="padding:1rem;text-align:center;color:#fff;background:#222">© '+new Date().getFullYear()+' Printemps des Marais — Association loi 1901</div>'; }
        });
      }
      injectFragment('site-header','header.html');
      injectFragment('site-footer','footer.html');
    })();
  </script>
</body>
</html>
