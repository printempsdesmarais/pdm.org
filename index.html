<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accueil — Printemps des Marais</title>
  <meta name="description" content="Accueil du projet Printemps des Marais : mission, actualités et appels à participation.">
  <link rel="stylesheet" href="font.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main" class="sr-only">Aller au contenu</a>

  <!-- Header injecté -->
  <header id="site-header" aria-label="En-tête du site"></header>

  <main id="main" class="wrap" style="min-height:60vh;padding:2rem 1rem;">
    <h1>Accueil</h1>
    <p>(Contenu à venir)</p>
  </main>

  <!-- Footer injecté -->
  <footer id="site-footer" aria-label="Pied de page"></footer>

  <script>
    (function(){
      function injectFragment(targetId, url){
        const slot = document.getElementById(targetId);
        if(!slot) return;
        fetch(url, {credentials:'same-origin'})
          .then(r => r.text())
          .then(html => {
            slot.innerHTML = html;
            // Ré-exécute les <script> du fragment inséré
            const scripts = slot.querySelectorAll('script');
            scripts.forEach(old => {
              const s = document.createElement('script');
              for (const {name, value} of old.attributes) s.setAttribute(name, value);
              s.text = old.textContent;
              old.replaceWith(s);
            });
          })
          .catch(() => {
            if(targetId==='site-header'){
              slot.innerHTML = '<div class="nav"><a class="brand" href="index.html" style="color:#fff;text-decoration:none;font-weight:800">Printemps des Marais</a></div>';
            } else if(targetId==='site-footer'){
              slot.innerHTML = '<div style="padding:1rem;text-align:center;color:#fff;background:#222">© '+new Date().getFullYear()+' Printemps des Marais — Association loi 1901</div>';
            }
          });
      }
      injectFragment('site-header','header.html');
      injectFragment('site-footer','footer.html');
    })();
  </script>
</body>
</html>
