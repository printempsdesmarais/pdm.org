<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Galerie — Printemps des Marais</title>
  <meta name="description" content="Storyboard visuel du projet : images, séquences et légendes au fil des saisons.">

  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/content.css">
  <link rel="stylesheet" href="css/fonts.css">
</head>
<body class="page5">
  <div class="bg-container"><div class="bg-image"></div></div>
  <header id="site-header"></header>

  <main class="wrap" id="main">
    <h1 class="section-title">Galerie — Storyboard visuel</h1>
    <p class="lead">Une narration en images pour suivre l’évolution du terrain, des habitats et des poneys landais.</p>

    <!-- Storyboard simple (exemple) -->
    <section class="panel">
      <div class="grid-3">
        <figure class="media">
          <img src="images/storyboard/story1.jpg" alt="Il fût un temps..." loading="lazy">
          <figcaption>Il fût un temps…</figcaption>
        </figure>
        <figure class="media">
          <img src="images/storyboard/story2.jpg" alt="Où des poneys sauvages…" loading="lazy">
          <figcaption>Où des poneys sauvages…</figcaption>
        </figure>
        <figure class="media">
          <img src="images/storyboard/story3.jpg" alt="Peuplaient les plages" loading="lazy">
          <figcaption>Peuplaient les plages.</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/background.js"></script>
  <script src="js/injector.js"></script>
</body>
</html>
