    </a>

    <!-- Liens principaux -->
    <div class="nav-links" role="menubar">
      <a href="index.html" class="nav-link" role="menuitem">Accueil</a>
      <a href="projet-1.html" class="nav-link" role="menuitem">Notre Mission</a>

      <!-- Élément avec sous-menu -->
      <div class="nav-group" role="none">
        <button
          class="has-sub nav-link"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="submenu-decouvrir">
          Découvrir
          <svg class="caret" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M5 7l5 6 5-6" fill="currentColor"/>
          </svg>
        </button>
        <div class="submenu" id="submenu-decouvrir" role="menu" aria-label="Découvrir">
          <a href="actus.html" class="submenu-link" role="menuitem">Actualités / Blog</a>
          <a href="galerie.html" class="submenu-link" role="menuitem">Galerie / Storyboard visuel</a>
          <a href="a-propos.html" class="submenu-link" role="menuitem">À propos</a>

        </div>

      <a href="agir.html" class="nav-link" role="menuitem">Agir Ensemble</a>

    </div>

    <!-- Burger -->

    <label for="nav-toggle" class="hamburger" aria-controls="mobileMenu" aria-expanded="false">
      <span></span><span></span><span></span>
    </label>

    <!-- Menu mobile -->
    <div class="mobile-menu" id="mobileMenu">
      <!-- Boutons orange demandés -->

      <!-- Sous-menu mobile (accordion) — Découvrir en orange -->

        <a href="actus.html" class="mobile-link sub">Actualités / Blog</a>
        <a href="galerie.html" class="mobile-link sub">Galerie / Storyboard visuel</a>

<script>
  // Toggle accessible du sous-menu (ajoute/retire .open au groupe)
  (function(){
    const group = document.querySelector('.nav-group');
    if (!group) return;
    const trigger = group.querySelector('.has-sub');
    const panel   = document.getElementById('submenu-decouvrir');
    let open = false;

    function setState(state){
      open = state;
      trigger.setAttribute('aria-expanded', String(open));
      group.classList.toggle('open', open);
    }

    // Ouvre au survol et focus, ferme en sortie
    group.addEventListener('mouseenter', () => setState(true));
    group.addEventListener('mouseleave', () => setState(false));
    trigger.addEventListener('click', (e) => {
      e.preventDefault();
      setState(!open);
      // optionnel: focus sur le panel quand on ouvre au clic
      if (open && panel) panel.focus?.();
    });

    // Ferme avec Échap si ouvert
    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape') setState(false);
    });
  })();
</script>
